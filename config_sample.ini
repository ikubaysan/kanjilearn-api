[main]

[openai_api_client]
api_key =
base_url = https://api.openai.com
path = /v1/chat/completions
model = gpt-3.5-turbo
# model = gpt-4
max_response_tokens = 2048
max_prompt_chars = 4096
temperature = 0.5

[google_api_client]
api_key =
model = gemini-2.0-flash

[server]
sample_sentence_count = 3
min_seconds_between_requests_per_user = 5
public_hostname = http://subdomain.example.com
private_hostname = localhost
port = 5733
whitelist_enabled = True
whitelist = 127.0.0.1
max_chars_per_audio_url = 250

[quiz]
potential_answers_count = 5
max_chars_per_answer = 200
max_chars_per_kanji_info_section = 2000
